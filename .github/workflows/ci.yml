name: AI Proje Ofisi CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify-source-and-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: python3 -m pip install --quiet pydantic

      - name: Run unit and security test suite
        run: python3 -B scripts/development/run.py verify

      - name: Verify repository layout and SHA256 manifest
        run: python3 -B scripts/verification/verify_layout.py

      - name: Compile native C launcher (r65_spawn_linux.c)
        run: |
          gcc -Wall -Wextra -Werror -O2 -shared -fPIC \
            -o /tmp/r65_spawn_linux.so \
            product/backend/native/linux/r65_spawn_linux.c

      - name: Optional static lint (ruff)
        run: |
          python3 -m pip install --quiet ruff
          ruff check product/backend/company_os/runtime/worker_daemon.py \
            product/backend/company_os/catalog/extensions_store.py \
            tests/unit/test_worker_daemon_and_087_api.py

  release-security-gates:
    name: Release Security (Trivy, Syft, Grant)
    runs-on: ubuntu-latest
    needs: verify-source-and-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare security report directory
        run: mkdir -p security-reports

      - name: Trivy vulnerability and secret scan (blocking on CRITICAL/HIGH or secret)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          skip-dirs: "ARSIV,GUNCEL/compatibility,tests,evidence"
          format: "json"
          output: "security-reports/trivy-report.json"
          exit-code: "1"

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0.24.0
        with:
          path: "product"
          format: "cyclonedx-json"
          output-file: "security-reports/sbom-cyclonedx.json"
          upload-artifact: false

      - name: Install Anchore Grant (pinned v0.8.0)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grant/v0.8.0/install.sh | sudo sh -s -- -b /usr/local/bin v0.8.0
          grant version

      - name: Enforce license policy with Grant
        run: |
          grant check -c .github/grant.yml -o json security-reports/sbom-cyclonedx.json > security-reports/grant-report.json

      - name: Upload security and SBOM reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-security-reports
          path: security-reports/
          retention-days: 30

