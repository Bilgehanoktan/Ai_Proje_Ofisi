<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>AI Proje Ofisi — Canlı Olay Paneli (SSE)</title>
  <link rel="stylesheet" href="/assets/tokens.css">
  <style>
    body { margin: 0; }
    main { max-width: 68rem; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.35rem; margin-bottom: 12px; }
    .top-nav { display: flex; gap: 10px; flex-wrap: wrap; }
    .top-nav a { padding: 6px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; }
    .top-nav a[aria-current="page"], .top-nav a:hover { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
    .bar { display: flex; gap: 8px; margin-bottom: 16px; }
    input, .bar button { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    .bar button { cursor: pointer; background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 600; }
    #status { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
    ul { list-style: none; padding: 0; display: grid; gap: 8px; }
    li { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-family: var(--font-mono); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/preview"><b aria-hidden="true">⌘</b>AI Proje Ofisi</a>
    <nav class="top-nav" aria-label="Ana gezinme">
      <a href="/preview">Sanal ofis</a>
      <a href="/preview/phaser">Phaser 2.5D</a>
      <a href="/live-events" aria-current="page">Canlı olaylar</a>
      <a href="/progress">İlerleme</a>
    </nav>
  </header>
  <main>
  <h1>AI Proje Ofisi — Canlı Olay ve Çoklu Görev Paneli (Salt Okunur SSE)</h1>
  <div class="bar">
    <input id="tenant" value="t1" placeholder="tenant_id">
    <button id="connect">Bağlan (/api/events)</button>
  </div>
  <div id="status">Durum: Beklemede</div>
  <div id="work-types" style="margin-bottom: 12px; font-size: 0.85rem; color: #cbd5e1;"></div>
  <ul id="events"></ul>
  <script>
    let es = null;
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("events");
    const wtEl = document.getElementById("work-types");
    fetch("/api/work-types")
      .then((r) => r.json())
      .then((data) => {
        const names = (data.work_types || []).map((w) => `${w.work_type} (${w.template_id})`).join(" · ");
        wtEl.textContent = `Kayıtlı İş Türleri: ${names}`;
      })
      .catch(() => { wtEl.textContent = "İş türleri okunamadı"; });
    document.getElementById("connect").addEventListener("click", () => {
      if (es) es.close();
      const tid = encodeURIComponent(document.getElementById("tenant").value.trim());
      statusEl.textContent = "Durum: Bağlanıyor...";
      es = new EventSource(`/api/events?tenant_id=${tid}`);
      es.onopen = () => { statusEl.textContent = `Durum: Bağlandı (tenant_id=${tid})`; };
      const appendEvent = (ev) => {
        const li = document.createElement("li");
        li.textContent = `[id=${ev.lastEventId} type=${ev.type}] ${ev.data}`;
        listEl.prepend(li);
        if (listEl.childElementCount > 512) listEl.lastElementChild.remove();
      };
      es.onmessage = appendEvent;
      [
        "ObjectiveCreated",
        "TaskCreated",
        "Migration087Verified",
        "MemoryPromoted",
        "BudgetSettled",
        "WorkerTaskClaimed",
        "WorkerTaskAccepted",
        "WorkerTaskRejected",
        "WorkerTaskError"
      ].forEach((t) => {
        es.addEventListener(t, appendEvent);
      });
      es.addEventListener("resync_required", () => {
        listEl.replaceChildren();
        const notice = document.createElement("li");
        notice.textContent = "Önceki olayların bir bölümü kullanılamıyor. Güncel olay penceresi gösteriliyor.";
        listEl.append(notice);
      });
      es.onerror = () => {
        statusEl.textContent = es.readyState === EventSource.CONNECTING
          ? "Durum: Yeniden bağlanıyor..."
          : "Durum: Akış kapalı";
      };
    });
  </script>
  </main>
</body>
</html>
