[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-proje-ofisi"
version = "0.1.0"
description = "AI Proje Ofisi kaynak geliştirme paketi; runtime kabulü değildir"
requires-python = ">=3.14"
dependencies = ["pydantic==2.12.5"]

[project.optional-dependencies]
database = ["psycopg[binary]==3.3.4"]
dev = [
    "ruff==0.15.5",
    "mypy==1.10.0"
]

[tool.setuptools.packages.find]
where = ["product/backend", "contracts/source/python", "verifier/src"]
include = ["company_os*", "packages*", "independent_verifier*"]
namespaces = false

[tool.setuptools.package-data]
independent_verifier = ["candidate_runner.py"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

